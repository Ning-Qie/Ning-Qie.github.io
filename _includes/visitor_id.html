<!-- 访客标识：只用于统计，不再参与日间/夜间主题记忆 -->
<script src="https://cdn.staticfile.org/fingerprintjs2/2.1.0/fingerprint2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.7.0/dist/av-min.js"></script>
<script>
(function () {
    'use strict';

    var tries = 0;

    function start() {
        tries += 1;
        if (tries > 50) return;
        var input = document.getElementById('visitor_id');
        if (!window.Fingerprint2 || !window.AV || !input) {
            setTimeout(start, 120);
            return;
        }

        Fingerprint2.get(function (components) {
            var values = components.map(function (component) {
                return component.value;
            });
            var vid = Fingerprint2.x64hash128(values.join(''), 31);
            input.value = vid;

            AV.init({
                appId: 'HYXrGkqM9CECl22sL7ftDoOU-MdYXbMMI',
                appKey: 'FfBgXOnF3vCgS1YfXrQqECOM'
            });

            var Visitor = AV.Object.extend('Visitor_Ning0_web');
            var query = new AV.Query('Visitor_Ning0_web');
            query.equalTo('visitor_id', vid);
            query.first().then(function (visitor) {
                if (visitor) return;
                var record = new Visitor();
                record.set('visitor_id', vid);
                // 保留旧字段，兼容已有 LeanCloud 表结构；主题已改由 localStorage 管理
                record.set('day_or_night', 'auto');
                return record.save();
            }).catch(function () {
                /* 统计失败不影响页面 */
            });
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
    } else {
        start();
    }
})();
</script>
