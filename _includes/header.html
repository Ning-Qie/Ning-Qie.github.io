<header id="header" class="header bg-white">
    <div class="navbar-container">
        <a href="{{ site.domain }}" id="header-site-title" class="navbar-logo">
            {{ site.name }}
        </a>
        <!--
        <a href="{{ '/' | prepend: site.baseurl }}" class="navbar-logo">
            <img src="{{ '/style/image/logo.png' | prepend: site.baseurl }}" alt="{{ site.name }}" />
            <span>{{ site.name }}</span>
        </a>-->
        <div class="navbar-menu">
            <a href="{{ '/archives' | prepend: site.baseurl }}" target="_blank">归档</a>
            <!-- <a href="{{ '/categories' | prepend: site.baseurl }}" target="_blank">分类</a> -->
            <!-- <a href="{{ '/tags' | prepend: site.baseurl }}" target="_blank">标签</a> -->
            <a href="{{ '/galleries' | prepend: site.baseurl }}" target="_blank">相册</a>
            <a href="{{ '/Hourglass' | prepend: site.baseurl }}" target="_blank">时光机</a>
            <a href="https://ning0ing.com/2020-06-26-zhaichao" target="_blank">句子</a>
            <a href="https://ning0ing.com/2022-11-15-Crazy-Poem" target="_blank">疯子的诗</a>
            <!-- <a href="http://web.ning0ing.com/" target="_blank">网址</a> -->
            <a href="{{ '/aboutme' | prepend: site.baseurl }}" target="_blank">About</a>
        </div>


        <div class="navbar-search" onclick="">
            <span class="icon-search"></span>
            <form id="search" method="get" action="/search" role="search" target="_self">
                <span class="search-box">
                    <input type="text" id="input" class="input" name="keyword" required="true" placeholder="Search..." maxlength="30" autocomplete="off">
                </span>
            </form>
        </div>

        
        <!--用以js函数判断的内容-->
        <input type="hidden" id="site_url" value="{{ site.url }}/">
        <input type="hidden" id="visitor_id" value="default">

        <a href="{{ '/music' | prepend: site.baseurl }}" class="icon_menu_ning" target="_blank">
            {% include icon_music.html %}
        </a>
        

        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换到夜间模式" aria-pressed="false" title="切换到夜间模式">
            <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>
            <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        </button>

        <div class="navbar-mobile-menu" onclick="">
            <span class="icon-menu cross"><span class="middle"></span></span>
            <ul>
                <li><a href="{{ '/archives' | prepend: site.baseurl }}" target="_blank">归档</a></li>
                <!-- <li><a href="{{ '/categories' | prepend: site.baseurl }}" target="_blank">分类</a></li> -->
                <!-- <li><a href="{{ '/tags' | prepend: site.baseurl }}" target="_blank">标签</a></li> -->
                <li><a href="{{ '/galleries' | prepend: site.baseurl }}" target="_blank">相册</a></li>
                <li><a href="{{ '/Hourglass' | prepend: site.baseurl }}" target="_blank">时光机</a></li>
                <li><a href="https://ning0ing.com/2020-06-26-zhaichao" target="_blank">句子</a></li>
                <li><a href="https://ning0ing.com/2022-11-15-Crazy-Poem" target="_blank">疯子的诗</a></li>
                <!-- <li><a href="{{ '/WebsiteCollection' | prepend: site.baseurl }}" target="_blank">网址</a></li> -->
                <li><a href="{{ '/aboutme' | prepend: site.baseurl }}" target="_blank">About</a></li>
            </ul>
        </div>
    </div>
</header>
